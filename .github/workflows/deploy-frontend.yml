name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # AWSへのアクセスにOIDC認証を使う場合のアクセス許可設定
    permissions:
      id-token: write
      contents: read

    steps:
