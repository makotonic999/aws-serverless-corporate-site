name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # AWSへのアクセスにOIDC認証を使う場合のアクセス許可設定
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS認証（OIDC）
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532970129307:role/GitHubActionsFrontendDeployRole
          aws-region: ap-northeast-1
          role-skip-session-tagging: true

      # S3への同期（frontend/ フォルダの中身をバケットのルートに同期）
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/ s3://okada-chikuro-site-hmd17889

      # CloudFrontのキャッシュ削除（インバリデーション）
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1IW3397JIPTO9 \
            --paths "/*"