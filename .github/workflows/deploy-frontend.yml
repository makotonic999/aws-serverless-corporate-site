name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # AWSへのアクセスにOIDC認証を使う場合のアクセス許可設定
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS認証（OIDC）
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532970129307:role/GitHubActionsFrontendDeployRole
          aws-region: ap-northeast-1

      # S3への同期
      - name: Deploy to S3
        run: |
          aws s3 sync . s3://okada-chikuro-site-hmd17889 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "backend/*" \
            --exclude "k8s/*" \
            --exclude "terraform/*"

      # CloudFrontのキャッシュ削除（インバリデーション）
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1IW3397JIPTO9 \
            --paths "/*"